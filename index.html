<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#05070E">
<title>Vishwa × Rift</title>
<style>
  :root{
    --bg:#05070E;
    --glass:rgba(18,26,44,.7);
    --line:rgba(120,140,180,.15);
    --ink:#F4F7FC;
    --text:#9DAAC2;
    --faint:#5A6884;
    --lime:#C6F32E;
    --rift:#6E8BFF;
    --good:#3DDC97;
    --bad:#FF6B6B;
    --mono:ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,monospace;
    --font:system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{font-family:var(--font);background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;overflow:hidden}

  .ambient{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
  .ambient i{position:absolute;border-radius:50%;filter:blur(2px)}
  .ambient i:nth-child(1){width:560px;height:560px;top:-200px;right:-190px;background:radial-gradient(circle,rgba(110,139,255,.15),transparent 62%)}
  .ambient i:nth-child(2){width:480px;height:480px;bottom:-170px;left:-160px;background:radial-gradient(circle,rgba(198,243,46,.07),transparent 62%)}

  .app{position:relative;z-index:1;height:100dvh;max-width:480px;margin:0 auto;display:flex;flex-direction:column;
    padding:calc(env(safe-area-inset-top,10px) + 4px) 0 0}
  @media(min-width:520px){body{background:#02040A}.app{border-left:1px solid var(--line);border-right:1px solid var(--line);background:var(--bg)}}

  /* header — collapses in from nothing */
  header{display:flex;align-items:center;gap:9px;padding:8px 18px 4px;flex:none;opacity:0;transition:opacity .5s}
  header.show{opacity:1}
  .logo svg{height:21px;width:auto;display:block}
  .x{color:var(--faint);font-size:12px}
  .rift{font-family:var(--mono);font-weight:700;font-size:13.5px;letter-spacing:.15em;
    background:linear-gradient(120deg,#9DB0FF,#5F7BFF);-webkit-background-clip:text;background-clip:text;color:transparent}
  .spacer{flex:1}
  .wpill{font-family:var(--mono);font-size:9px;letter-spacing:.08em;color:var(--good);
    border:1px solid rgba(61,220,151,.28);background:rgba(61,220,151,.09);border-radius:999px;padding:4px 9px;display:none}
  .wpill.show{display:block}
  .mute{border:1px solid var(--line);background:var(--glass);color:var(--text);border-radius:999px;width:29px;height:29px;
    font-size:12px;display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none}

  /* ---- zero state: orb + one question ---- */
  .zero{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:30px;padding:0 32px;text-align:center}
  .zero.gone{display:none}
  .orb{width:132px;height:132px;border-radius:50%;position:relative;
    background:radial-gradient(circle at 34% 30%,rgba(198,243,46,.85),rgba(110,139,255,.5) 52%,rgba(20,30,55,.9) 78%);
    box-shadow:0 0 70px -6px rgba(140,180,120,.4), inset 0 0 40px rgba(255,255,255,.12);
    animation:float 5s ease-in-out infinite}
  @keyframes float{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-9px) scale(1.03)}}
  .orb::after{content:'';position:absolute;inset:-14px;border-radius:50%;border:1px solid rgba(198,243,46,.2);animation:halo 3.4s ease-out infinite}
  @keyframes halo{0%{transform:scale(.9);opacity:.7}100%{transform:scale(1.3);opacity:0}}
  .zeroq{font-size:25px;font-weight:550;letter-spacing:-.02em;line-height:1.32;color:var(--ink)}
  .zerosub{font-size:13.5px;color:var(--faint);line-height:1.55;max-width:290px}

  /* ---- feed ---- */
  .feed{flex:1;overflow-y:auto;padding:6px 18px 14px;display:flex;flex-direction:column;gap:13px;scroll-behavior:smooth}
  .feed::-webkit-scrollbar{display:none}
  .feed.gone{display:none}
  .msg{max-width:93%;animation:rise .36s cubic-bezier(.2,.9,.3,1.2)}
  @keyframes rise{from{transform:translateY(15px);opacity:0}to{transform:none;opacity:1}}
  .msg.user{align-self:flex-end}
  .msg.user .bub{background:linear-gradient(135deg,#233457,#182740);border:1px solid rgba(140,160,210,.2);
    border-radius:18px 18px 5px 18px;padding:11px 15px;font-size:15px;color:var(--ink)}
  .who{font-family:var(--mono);font-size:7.5px;letter-spacing:.18em;color:var(--faint);margin-bottom:5px}
  .msg.user .who{text-align:right}
  .msg.agent .bub{background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(14px);
    border-radius:5px 18px 18px 18px;padding:13px 15px;font-size:14.5px;line-height:1.55;color:var(--text)}
  .bub b{color:var(--ink);font-weight:600}
  .bub .big{font-family:var(--mono);font-size:27px;font-weight:600;color:var(--ink);display:block;margin:3px 0 2px;letter-spacing:-.02em}
  .bub .sub{font-size:12.5px;color:var(--faint)}

  .card{background:rgba(8,13,26,.7);border:1px solid var(--line);border-radius:15px;padding:14px;margin-top:11px}
  .khead{font-family:var(--mono);font-size:8px;letter-spacing:.17em;color:var(--faint);margin-bottom:10px}
  .row{display:flex;justify-content:space-between;align-items:baseline;font-size:12.5px;color:var(--text);padding:5px 0}
  .row b{font-family:var(--mono);font-weight:550;color:var(--ink)}
  .win{color:var(--good)}

  /* venue ladder */
  .v{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:11px;margin-top:6px;font-size:12.5px;color:var(--text);border:1px solid transparent;opacity:0;transform:translateX(-8px);transition:all .35s}
  .v.show{opacity:1;transform:none}
  .v .vn{font-weight:600;color:var(--ink)}
  .v .vd{font-family:var(--mono);font-size:9.5px;color:var(--faint)}
  .v .vr{margin-left:auto;font-family:var(--mono);font-size:12px;text-align:right}
  .v.best{background:rgba(110,139,255,.13);border-color:rgba(110,139,255,.34)}
  .v.best .vr{color:#B3C4FF;font-weight:600}
  .btag{font-family:var(--mono);font-size:7px;letter-spacing:.1em;background:linear-gradient(120deg,#9DB0FF,#5F7BFF);color:#0A1128;border-radius:4px;padding:2px 5px;font-weight:700}
  .split{font-family:var(--mono);font-size:10px;color:var(--rift);margin-top:9px;letter-spacing:.02em}

  /* policy gates */
  .gh{display:flex;align-items:center;gap:7px;font-family:var(--mono);font-size:8px;letter-spacing:.15em;color:var(--lime);margin-top:12px}
  .gh::before{content:'';width:13px;height:1px;background:var(--lime);opacity:.5}
  .gates{margin-top:7px;display:flex;flex-direction:column;gap:5px}
  .g{display:flex;align-items:flex-start;gap:8px;font-size:12px;color:var(--text);opacity:0;transform:translateX(-6px);transition:all .3s}
  .g.show{opacity:1;transform:none}
  .g i{width:14px;height:14px;border-radius:50%;background:rgba(61,220,151,.14);color:var(--good);font-size:8px;font-style:normal;
    display:flex;align-items:center;justify-content:center;flex:none;margin-top:2px}
  .g.warn i{background:rgba(255,194,75,.15);color:#FFC24B}

  /* face id */
  .faceid{width:100%;margin-top:12px;border:none;border-radius:14px;padding:15px;cursor:pointer;
    background:linear-gradient(135deg,var(--lime),#A8D619);color:#1A2405;font-size:15px;font-weight:650;font-family:var(--font);
    display:flex;align-items:center;justify-content:center;gap:9px;box-shadow:0 8px 26px -8px rgba(198,243,46,.5)}
  .faceid:active{transform:scale(.98)}
  .faceid.done{background:rgba(61,220,151,.13);color:var(--good);box-shadow:none;cursor:default}
  .noseed{font-size:11px;color:var(--faint);text-align:center;margin-top:9px;line-height:1.5}

  /* route */
  .route{display:flex;align-items:center;justify-content:space-between;margin:14px 2px 2px;position:relative}
  .rn{display:flex;flex-direction:column;align-items:center;gap:6px;z-index:2;min-width:50px}
  .rn .rc{width:36px;height:36px;border-radius:50%;background:#0A1020;border:1px solid var(--line);display:flex;align-items:center;
    justify-content:center;font-weight:700;font-size:10.5px;color:var(--text);transition:all .35s}
  .rn.on .rc{border-color:var(--rift);color:#fff;box-shadow:0 0 18px rgba(110,139,255,.55)}
  .rn.done .rc{border-color:var(--good);color:var(--good)}
  .rn span{font-family:var(--mono);font-size:7.5px;letter-spacing:.07em;color:var(--faint);text-align:center}
  .rline{position:absolute;top:18px;left:42px;right:42px;height:2px;background:rgba(120,140,180,.14);z-index:1;border-radius:2px}
  .rfill{height:100%;width:0;background:linear-gradient(90deg,var(--rift),#B3C4FF);border-radius:2px;transition:width .85s ease;box-shadow:0 0 10px rgba(110,139,255,.6)}
  .rstep{font-family:var(--mono);font-size:10px;color:var(--text);margin-top:10px;min-height:14px}
  .rstep.done{color:var(--good)}

  .receipt{font-family:var(--mono);font-size:10px;color:var(--text);background:rgba(4,7,15,.85);border:1px solid var(--line);
    border-radius:11px;padding:11px 13px;margin-top:11px;line-height:1.85;overflow-x:auto;white-space:nowrap}
  .receipt .h{color:var(--lime)}.receipt .g2{color:var(--good)}

  .say{display:inline-flex;align-items:center;gap:8px;margin-top:12px;font-size:13px;color:var(--lime);
    background:rgba(198,243,46,.11);border:1px solid rgba(198,243,46,.26);border-radius:999px;padding:8px 15px}
  .say .p{width:7px;height:7px;border-radius:50%;background:var(--lime);animation:bl 1.5s infinite}
  @keyframes bl{0%,100%{opacity:1}50%{opacity:.35}}

  /* own banner */
  .own{background:linear-gradient(135deg,rgba(61,220,151,.16),rgba(110,139,255,.1));border:1px solid rgba(61,220,151,.3);
    border-radius:15px;padding:16px;margin-top:11px;text-align:center}
  .own .ob{font-family:var(--mono);font-size:24px;font-weight:600;color:var(--ink);letter-spacing:-.02em}
  .own .os{font-size:12px;color:var(--good);margin-top:4px}

  /* dock */
  .dock{flex:none;padding:8px 18px calc(env(safe-area-inset-bottom,10px) + 12px);
    background:linear-gradient(180deg,transparent,rgba(3,5,11,.94) 34%);display:flex;flex-direction:column;align-items:center;gap:9px}
  .hints{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;min-height:30px}
  .hint{border:1px solid var(--line);background:var(--glass);backdrop-filter:blur(10px);color:var(--text);
    border-radius:999px;padding:6px 12px;font-size:11px;cursor:pointer;transition:all .15s;animation:rise .3s}
  .hint:active{transform:scale(.95);border-color:var(--rift)}
  .vbar{display:flex;align-items:center;gap:14px;width:100%}
  .tr{flex:1;min-height:19px;font-size:13.5px;color:var(--text);text-align:right;font-style:italic;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
  .mw{position:relative;flex:none}

  /* keep pill — the concrete savings vs next-best route, made loud */
  .keep{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:11px;font-size:13px;color:var(--ink);
    background:rgba(61,220,151,.12);border:1px solid rgba(61,220,151,.32);border-radius:12px;padding:11px}
  .keep b{font-family:var(--mono);font-size:17px;color:var(--good)}

  /* order ticket — structured parse of the spoken order (accuracy proof) */
  .ticket{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:12px}
  .tk{background:rgba(4,7,15,.75);border:1px solid var(--line);border-radius:9px;padding:7px 9px}
  .tk span{display:block;font-family:var(--mono);font-size:7px;letter-spacing:.14em;color:var(--faint)}
  .tk b{display:block;font-family:var(--mono);font-size:12px;font-weight:600;color:var(--ink);margin-top:3px;white-space:nowrap}
  .tk.hot b{color:var(--lime)}

  /* desktop — institutional screen-recording layout */
  @media(min-width:900px){
    .app{max-width:660px}
    .zeroq{font-size:34px}
    .zerosub{font-size:15.5px;max-width:360px}
    .msg.user .bub{font-size:17px;padding:13px 18px}
    .msg.agent .bub{font-size:16px;padding:16px 19px}
    .bub .big{font-size:36px}
    .bub .sub{font-size:14px}
    .card{padding:18px;border-radius:17px}
    .khead{font-size:9px}
    .row{font-size:14px}
    .v{font-size:14px;padding:10px 12px}
    .v .vr{font-size:13.5px}
    .v .vd{font-size:10.5px}
    .g{font-size:13.5px}
    .hint{font-size:13px;padding:8px 15px}
    .tr{font-size:16px}
    .own .ob{font-size:30px}
    .receipt{font-size:11px}
    .say{font-size:14px}
    .who{font-size:8.5px}
    .tk span{font-size:8px}
    .tk b{font-size:14px}
    .mstat{font-size:9px}
    .keep{font-size:15px}
    .keep b{font-size:21px}
  }
  .mring{position:absolute;inset:-9px;border-radius:50%;border:1.5px solid rgba(198,243,46,.35);opacity:0}
  .listening .mring{animation:ring 1.5s infinite}
  @keyframes ring{0%{opacity:.85;transform:scale(.85)}100%{opacity:0;transform:scale(1.45)}}
  .mic{width:66px;height:66px;border-radius:50%;border:none;cursor:pointer;position:relative;
    background:linear-gradient(150deg,var(--lime),#9BC91B);color:#1A2405;font-size:25px;display:flex;align-items:center;justify-content:center;
    box-shadow:0 8px 30px -6px rgba(198,243,46,.45);transition:all .2s}
  .listening .mic{background:linear-gradient(150deg,#FF9A9A,#FF6B6B);color:#2A0808;box-shadow:0 8px 30px -6px rgba(255,107,107,.5)}
  .mic:active{transform:scale(.94)}
  .wave{display:flex;align-items:center;gap:3px;height:24px;width:60px;visibility:hidden;flex:none}
  .listening .wave{visibility:visible}
  .wave i{width:3px;border-radius:2px;background:var(--lime);height:5px}
  .listening .wave i{animation:wv .85s ease-in-out infinite}
  .wave i:nth-child(2){animation-delay:.09s}.wave i:nth-child(3){animation-delay:.18s}
  .wave i:nth-child(4){animation-delay:.27s}.wave i:nth-child(5){animation-delay:.36s}.wave i:nth-child(6){animation-delay:.45s}
  @keyframes wv{0%,100%{height:4px}50%{height:21px}}
  .mstat{font-family:var(--mono);font-size:8px;letter-spacing:.17em;color:var(--faint)}
  .mstat.hot{color:var(--bad)}
</style>
</head>

      <path fill="#05070E" transform="translate(217,262)" d="m0 0h1l1 10 3 5 4 2 10 1-1 3-12 2-3 3-2 12-2 1-3-14-3-2-12-2 15-15z"/>

  </div>
</div>

<script>
/* ================= state ================= */
let BTC = 96000, ETH = 2900;  // fallback values — refreshed with live spot prices below
(async () => {
  try{
    const r = await fetch('https://api.coinbase.com/v2/prices/BTC-USD/spot', {signal: AbortSignal.timeout(4000)});
    const b = (await r.json())?.data?.amount;
    if(+b > 0) BTC = Math.round(+b);
    const r2 = await fetch('https://api.coinbase.com/v2/prices/ETH-USD/spot', {signal: AbortSignal.timeout(4000)});
    const e = (await r2.json())?.data?.amount;
    if(+e > 0) ETH = Math.round(+e);
  }catch(_){ /* offline or blocked — keep fallbacks, demo still runs */ }
})();
const S = {
  wallet: null,          // address once created
  btc: 0, usdc: 0, vault: 0,
  vaults: [],            // desk mode: [{name, chain, apy, bal}]
  stage: 'cold',         // cold | needAmount | quote | owns | desk | vault
  want: null,            // {asset, amount}
  pending: null,
  muted: false,
};
const $ = id => document.getElementById(id);
const feed = $('feed');
const fmt = n => '$' + Math.round(n).toLocaleString('en-US');
const fmt2 = n => '$' + n.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const hx = (n=8) => Array.from({length:n},()=>'0123456789abcdef'[Math.floor(Math.random()*16)]).join('');
const vib = p => { try{ navigator.vibrate && navigator.vibrate(p); }catch{} };
const scroll = () => { feed.scrollTop = feed.scrollHeight; };

/* ================= voice out ================= */
function pickVoice(){
  const vs = speechSynthesis.getVoices().filter(v=>/^en[-_]/i.test(v.lang));
  // Premium/enhanced neural voices sound far less robotic than the defaults.
  const pref = [/ava.*premium/i, /premium/i, /enhanced/i, /natural|neural/i, /siri/i, /google us english/i, /samantha/i];
  for(const p of pref){ const v = vs.find(v=>p.test(v.name)); if(v) return v; }
  return vs.find(v=>/en-US/i.test(v.lang)) || vs[0] || null;
}
function speak(t){
  if(S.muted || !window.speechSynthesis) return;
  const u = new SpeechSynthesisUtterance(t);
  u.rate = 1.0; u.pitch = 1.0;
  u.voice = pickVoice();
  speechSynthesis.cancel(); speechSynthesis.speak(u);
}
function toggleMute(){ S.muted=!S.muted; $('mutebtn').textContent = S.muted?'🔇':'🔊'; if(S.muted) speechSynthesis?.cancel(); }

/* ================= voice in ================= */
let rec=null, listening=false, lastHeard='', dispatched=false;
function initRec(){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR) return null;
  const r = new SR();
  r.lang='en-US'; r.interimResults=true; r.continuous=false; r.maxAlternatives=1;
  r.onresult = e => {
    let interim='', final='';
    for(let i=0;i<e.results.length;i++){
      const t=e.results[i][0].transcript;
      if(e.results[i].isFinal) final+=t; else interim+=t;
    }
    lastHeard = (final||interim).trim();
    $('tr').textContent = lastHeard;
    if(final && !dispatched){ dispatched=true; stopListen(); heard(final.trim()); }
  };
  // iOS Safari often never flags a result final — dispatch what we last heard.
  r.onend = () => { stopListen(); if(!dispatched && lastHeard){ dispatched=true; heard(lastHeard); } };
  r.onerror = e => {
    if(e.error==='not-allowed'){ handsFree=false; stopListen(); $('mstat').textContent='ALLOW MIC ACCESS IN SETTINGS'; return; }
    stopListen();
  };
  return r;
}
let handsFree = false;   // desk mode: conversation stays open, no re-tap between turns
function toggleListen(){
  if(typeof DESK !== 'undefined' && DESK){
    handsFree = !handsFree;
    handsFree ? startListen(true) : stopListen();
    return;
  }
  listening?stopListen():startListen();
}
function startListen(auto){
  if(!rec) rec=initRec();
  if(!rec){ $('mstat').textContent='TAP THE SUGGESTIONS ABOVE'; return; }
  if(!auto) speechSynthesis?.cancel();   // manual tap interrupts the agent; auto-resume must not
  listening=true; lastHeard=''; dispatched=false;
  $('dock').classList.add('listening');
  $('mstat').textContent='LISTENING…'; $('mstat').classList.add('hot');
  $('tr').textContent=''; vib(12);
  try{ rec.start(); }catch{ try{ rec.stop(); setTimeout(()=>rec.start(),150); }catch{} }
}
function stopListen(){
  listening=false;
  $('dock').classList.remove('listening');
  $('mstat').textContent = handsFree ? 'HANDS-FREE — JUST TALK' : 'TAP AND SPEAK';
  $('mstat').classList.remove('hot');
  try{ rec&&rec.stop(); }catch{}
}
// Hands-free loop: reopen the mic whenever recognition ends, but never over the agent's voice.
setInterval(()=>{
  if(handsFree && !listening && !document.hidden && !(window.speechSynthesis && speechSynthesis.speaking)) startListen(true);
}, 800);

/* ================= feed ================= */
function leaveZero(){
  if(!$('zero').classList.contains('gone')){
    $('zero').classList.add('gone'); feed.classList.remove('gone'); $('hdr').classList.add('show');
  }
}
function you(t){ leaveZero();
  const m=document.createElement('div'); m.className='msg user';
  m.innerHTML=`<div class="who">YOU · VOICE</div><div class="bub">${t}</div>`;
  feed.appendChild(m); scroll(); return m;
}
function agent(html, spoken){ leaveZero();
  const m=document.createElement('div'); m.className='msg agent';
  m.innerHTML=`<div class="who">AGENT</div><div class="bub">${html}</div>`;
  feed.appendChild(m); scroll(); if(spoken) speak(spoken); return m;
}
function reveal(sel, cls='show', gap=340, start=260){
  document.querySelectorAll(sel).forEach((el,i)=>setTimeout(()=>{el.classList.add(cls);vib(7);scroll()}, start+i*gap));
}
function hints(list){
  $('hints').innerHTML = list.map(h=>`<button class="hint" onclick="heard('${h.replace(/'/g,"\\'")}')">${h}</button>`).join('');
}

/* ================= intents ================= */
function amountOf(t){
  t = t.toLowerCase().replace(/,/g,'');
  let m = t.match(/(\d+(?:\.\d+)?)\s*(m|million)\b/); if(m) return parseFloat(m[1])*1e6;
  m = t.match(/(\d+(?:\.\d+)?)\s*(k|thousand|grand)\b/); if(m) return parseFloat(m[1])*1e3;
  const w = {one:1,two:2,three:3,four:4,five:5,six:6,seven:7,eight:8,nine:9,ten:10,twenty:20,fifty:50,hundred:100};
  for(const [k,v] of Object.entries(w)){
    if(new RegExp('\\b'+k+'\\s+million\\b').test(t)) return v*1e6;
    if(new RegExp('\\b'+k+'\\s+thousand\\b').test(t)) return v*1e3;
    if(new RegExp('\\b'+k+'\\s+hundred\\b').test(t)) return v*100;
  }
  m = t.match(/(\d+(?:\.\d+)?)/); if(m) return parseFloat(m[1]);
  return null;
}
function assetOf(t){
  t=t.toLowerCase();
  if(/bitcoin|btc/.test(t)) return 'BTC';
  if(/ether|eth\b/.test(t)) return 'ETH';
  if(/usdc|dollar|stable|cash/.test(t)) return 'USDC';
  return null;
}

function heard(text){
  if(!text) return;
  you(text);
  const t = text.toLowerCase();

  if(/\b(yes|yeah|yep|sure|ok|okay|go ahead|do it|please|confirm|approve|send it)\b/.test(t)) return affirm(t);
  if(/\b(no|nope|cancel|stop|abort|nevermind)\b/.test(t)) return deny();
  // A bare amount answers the pending "how much?" — don't re-sniff the asset
  // from filler words like "dollars".
  if(S.stage==='needAmount' && amountOf(t) !== null) return quote((S.want&&S.want.asset)||'BTC', amountOf(t));
  if(/\b(sell|offload|unload|reduce)\b/.test(t) || /\bmillion\b/.test(t)) return deskOrder(t);
  if(S.vaults.length && /vault|yield|work|earn|interest|idle|rebalance|optimi|risk|better|apy|move my/.test(t)) return yieldScan(t);
  if(/vault|yield|work|earn|interest|idle/.test(t)) return vaultOffer(t);
  if(/position|portfolio|holding|balance|own|have/.test(t) && S.wallet) return showPositions();
  if(/buy|get|own|want|purchase|swap|convert|trade/.test(t) || assetOf(t)) return wantAsset(t);
  if(/limit|policy|rule|safe/.test(t)) return showPolicy();

  agent(`Tell me what you want to own — like <b>“buy some bitcoin”</b>. I'll open a wallet if you don't have one, find the best price across every venue, and settle it.`,
    `Tell me what you want to own. For example, buy some bitcoin.`);
}

/* ---- act 1: want asset ---- */
function wantAsset(t){
  const asset = assetOf(t) || 'BTC';
  const amt = amountOf(t);
  S.want = {asset, amount: amt};
  if(!S.wallet) return offerWallet(asset);
  if(!amt) return askAmount(asset);
  return quote(asset, amt);
}
function offerWallet(asset){
  setTimeout(()=>{
    agent(`Nice — <b>${asset === 'BTC' ? 'bitcoin' : asset}</b> it is. You don't have a wallet yet, so let's make one. It takes one second and there's <b>no seed phrase to write down</b> — your face is the key.
      <button class="faceid" id="fid" onclick="createWallet()">Create wallet with Face ID</button>

      `${asset==='BTC'?'Bitcoin':asset} it is. You don't have a wallet yet — let's make one. No seed phrase, your face is the key. Tap to create it.`);

}
async function createWallet(){

  btn.textContent = ok ? '✓ Secured with Face ID' : '✓ Wallet created';
  $('wpill').textContent = S.wallet; $('wpill').classList.add('show');
  vib([12,50,12]);
  setTimeout(()=>{
    agent(`Wallet live: <b>${S.wallet}</b> — passkey-secured, works on Bitcoin, Ethereum, Base and Arbitrum at once.
      <div class="card">
        <div class="khead">SPENDING LIMITS · SET BY VOICE</div>
        <div class="row"><span>Per trade</span><b>$25,000</b></div>
        <div class="row"><span>Daily</span><b>$100,000</b></div>
        <div class="row"><span>Venues</span><b>whitelist enforced</b></div>
        <div class="row"><span>Kill switch</span><b>armed</b></div>
      </div>
      How much do you want to put in?`,
      `Wallet is live and passkey secured — it works across Bitcoin, Ethereum, Base and Arbitrum at once. Spending limits are set. How much do you want to put in?`);
    S.stage='needAmount';
    hints(['Five hundred dollars','Two thousand dollars']);
  }, 900);
}
function askAmount(asset){
  setTimeout(()=>{
    agent(`How much do you want to put into <b>${asset==='BTC'?'bitcoin':asset}</b>?`, `How much do you want to put in?`);
    S.stage='needAmount';
    hints(['Five hundred dollars','Two thousand dollars']);

}

/* ---- act 1: quote ---- */
function quote(asset, usd){
  const px = asset==='BTC'?BTC:asset==='ETH'?ETH:1;
  const units = usd/px;
  const dec = asset==='BTC'?5:asset==='ETH'?4:2;
  const worse = usd/px*0.9972, saved = (units-worse)*px;
  S.pending = {kind:'buy', asset, usd, units};
  setTimeout(()=>{
    agent(`Best price for <b>${fmt(usd)}</b> of ${asset==='BTC'?'bitcoin':asset}, checked across every venue:
      <div class="card">
        <div class="khead">RIFT · BEST EXECUTION</div>
        <span class="big">${units.toFixed(dec)} ${asset}</span>
        <div class="sub">at ${fmt2(px)} per ${asset} · you keep <span class="win">${fmt2(saved)}</span> more than the next best venue</div>
        <div class="v best"><span class="vn">Rift routed</span><span class="btag">BEST</span><span class="vr">${units.toFixed(dec)}</span></div>
        <div class="v"><span class="vn">Single venue</span><span class="vr">${worse.toFixed(dec)}</span></div>
        <div class="row" style="margin-top:9px"><span>Fee, all in</span><b>0.08%</b></div>
        <div class="row"><span>You'll have it in</span><b>~40 seconds</b></div>

        <div class="gates">
          <div class="g"><i>✓</i>Within your $25,000 per-trade limit</div>
          <div class="g"><i>✓</i>Venue whitelisted, route verified</div>
        </div>
        <div class="say"><span class="p"></span>Say “confirm”</div>
      </div>`,
      `${fmt(usd)} gets you ${units.toFixed(dec)} ${asset==='BTC'?'bitcoin':asset} — that's ${saved.toFixed(2)} dollars better than any single venue. Within your limits. Say confirm.`);
    reveal('.msg:last-child .v', 'show', 260, 200);
    reveal('.msg:last-child .g', 'show', 340, 700);
    S.stage='quote';
    hints(['Confirm','Cancel']);
  }, 420);
}

/* ---- act 2: desk-scale order ---- */
function deskOrder(t){
  if(!S.wallet){ S.want={asset:'BTC',amount:null}; return offerWallet('BTC'); }
  const amt = amountOf(t) || 5e5;
  const usdc = amt*0.9989;
  const spokenAmt = amt >= 1e6 ? `${Math.round(amt/1e5)/10} million` : `${Math.round(amt/1e3)} thousand`;
  S.pending = {kind:'desk', amt, usdc};
  setTimeout(()=>{
    agent(`Desk order — <b>${fmt(amt)} BTC → USDC on Base</b>. Pulling live depth across 20+ venues at that size:
      <div class="card">
        <div class="khead">ORDER TICKET · PARSED FROM VOICE</div>
        <div class="ticket">
          <div class="tk"><span>SIDE</span><b>SELL</b></div>
          <div class="tk"><span>ASSET</span><b>BTC</b></div>
          <div class="tk hot"><span>NOTIONAL</span><b>${fmt(amt)}</b></div>
          <div class="tk"><span>SETTLE</span><b>USDC·BASE</b></div>
        </div>
        <div class="khead">RFQ · SIZE-AWARE ROUTING</div>
        <div class="v best"><span class="vn">Rift split route</span><span class="btag">BEST</span><span class="vr">${fmt(usdc)}<div class="vd">0.11% slippage</div></span></div>
        <div class="v"><span class="vn">UniswapX<div class="vd">depth ${fmt(amt*0.7)}</div></span><span class="vr">${fmt(amt*0.9963)}<div class="vd">0.37%</div></span></div>
        <div class="v"><span class="vn">CoW Swap<div class="vd">depth ${fmt(amt*0.45)}</div></span><span class="vr">${fmt(amt*0.9951)}<div class="vd">0.49%</div></span></div>
        <div class="v"><span class="vn">OTC counterparty<div class="vd">firm quote, 60s</div></span><span class="vr">${fmt(amt*0.9975)}<div class="vd">0.25%</div></span></div>
        <div class="split">SPLIT · 55% UniswapX · 30% CoW Swap · 15% OTC — one signature, bridged to Base</div>
        <div class="keep">You keep <b>+${fmt(usdc-amt*0.9975)}</b> vs next-best route · 0 added fees</div>
        <div class="row"><span>Settlement</span><b>Bitcoin → Base · ~4 min</b></div>
        <div class="gh">DESK POLICY</div>
        <div class="gates">
          <div class="g"><i>✓</i>Counterparty on approved list, AML clear</div>
          <div class="g"><i>✓</i>Slippage inside desk tolerance — 0.5%</div>
          <div class="g warn"><i>!</i>Above your solo limit — needs a second approver</div>
        </div>
        <div class="say"><span class="p"></span>Say “confirm” to route for approval</div>
      </div>`,
      `${spokenAmt} in bitcoin to U S D C on Base. Best fill is a split route across three venues — that keeps about ${Math.round((usdc-amt*0.9975)/100)/10} thousand dollars more than the best single venue. It's above your solo limit, so it needs a second approver. Say confirm.`);
    reveal('.msg:last-child .v','show',280,200);
    reveal('.msg:last-child .g','show',360,1300);
    S.stage='desk';
    hints(['Confirm','Cancel']);
  }, 450);
}

/* ---- desk act: yield rebalance across vaults ---- */
function yieldScan(){
  const tot = S.vaults.reduce((s,v)=>s+v.bal,0);
  const blended = S.vaults.reduce((s,v)=>s+v.bal*v.apy,0)/tot;
  const target = {name:'Morpho Blue', chain:'Base', apy:7.4};
  const gain = Math.round(tot*(target.apy-blended)/100/100)*100;
  // Route costs to move the full stable stack — Rift best vs the two runners-up.
  const routes = [
    {name:'Rift · CCTP direct', fee:130,  min:2,  best:true},
    {name:'LI.FI bridge+swap',  fee:780,  min:8},
    {name:'Chainflip',          fee:1300, min:14},
  ];
  const keep = routes[1].fee - routes[0].fee;
  S.pending = {kind:'rebalance', tot, blended, target, gain, keep, fee:routes[0].fee};
  setTimeout(()=>{
    agent(`You're earning <b>${blended.toFixed(1)}% blended</b> on ${fmt(tot)} of stables. There's a better home on your approved list — same risk tier:
      <div class="card">
        <div class="khead">CURRENT ALLOCATION</div>
        ${S.vaults.map(v=>`<div class="v"><span class="vn">${v.name}<div class="vd">${v.chain}</div></span><span class="vr">${fmt(v.bal)}<div class="vd">${v.apy}% APY</div></span></div>`).join('')}
        <div class="khead" style="margin-top:13px">TARGET · SCANNED 20+ VENUES</div>
        <div class="v best"><span class="vn">${target.name}<div class="vd">${target.chain} · approved list · no lock-up</div></span><span class="btag">${target.apy}% APY</span><span class="vr">+${fmt(gain)}/yr</span></div>
        <div class="khead" style="margin-top:13px">ROUTE · ${fmt(tot)} → ${target.chain.toUpperCase()}</div>
        ${routes.map(r=>`<div class="v${r.best?' best':''}"><span class="vn">${r.name}${r.best?'</span><span class="btag">BEST':''}</span><span class="vr">${fmt2(r.fee)} fee<div class="vd">~${r.min} min</div></span></div>`).join('')}
        <div class="keep">You keep <b>+${fmt(keep)}</b> vs next-best route · 0 added fees</div>
        <div class="gh">POLICY</div>
        <div class="gates">
          <div class="g"><i>✓</i>Vault on approved list · TVL & audit checks pass</div>
          <div class="g"><i>✓</i>Concentration stays under 40%</div>
          <div class="g"><i>✓</i>No lock-up — unwind by voice anytime</div>
        </div>
        <div class="say"><span class="p"></span>Say “confirm” to move it</div>
      </div>`,
      `You're earning ${blended.toFixed(1)} percent blended on ${Math.round(tot/1000)} thousand of stables. ${target.name} on ${target.chain} pays ${target.apy} — same risk tier, on your approved list. Best route costs ${routes[0].fee} dollars and keeps ${keep} more than the next best. That's ${Math.round(gain/1000)} thousand a year extra. Say confirm to move it.`);
    reveal('.msg:last-child .v','show',260,200);
    reveal('.msg:last-child .g','show',340,1400);
    S.stage='rebalance';
    hints(['Confirm','Cancel']);
  }, 420);
}

/* ---- act 3: vault ---- */
function vaultOffer(t){
  if(!S.wallet){ S.want={asset:'USDC',amount:amountOf(t)}; return offerWallet('USDC'); }
  const idle = S.usdc || 24000;
  const amt = amountOf(t) || idle;
  S.pending = {kind:'vault', amt};

    agent(`You've got <b>${fmt(amt)}</b> sitting idle. Best risk-adjusted home for it right now:
      <div class="card">
        <div class="khead">VAULT · CROSS-CHAIN VIA RIFT</div>
        <span class="big">7.4% APY</span>
        <div class="sub">Stable yield vault on Base · deposit from any chain, receipt tokens back in your wallet</div>
        <div class="row" style="margin-top:8px"><span>Depositing</span><b>${fmt(amt)}</b></div>
        <div class="row"><span>Projected</span><b class="win">+${fmt(amt*0.074)}/yr</b></div>
        <div class="row"><span>Unwind</span><b>anytime, no lock-up</b></div>
        <div class="gh">POLICY</div>
        <div class="gates">
          <div class="g"><i>✓</i>Vault on approved list</div>
          <div class="g"><i>✓</i>Concentration stays under 40%</div>
        </div>
        <div class="say"><span class="p"></span>Say “confirm”</div>
      </div>`,
      `You have ${Math.round(amt/1000)} thousand sitting idle. The stable vault on Base pays seven point four percent, deposit from any chain, unwind anytime. That's about ${Math.round(amt*0.074)} dollars a year. Say confirm.`);
    reveal('.msg:last-child .g','show',340,400);
    S.stage='vault';
    hints(['Confirm','Cancel']);
  }, 420);
}

/* ---- policy / positions ---- */
function showPolicy(){
  agent(`Your rules: <b>$25,000</b> per trade · <b>$100,000</b> a day · venue whitelist · slippage capped at 0.5% · anything above your solo limit needs a second approver · kill switch armed. Every action leaves a signed receipt.`,
    `Twenty five thousand per trade, a hundred thousand a day, venue whitelist, and anything bigger needs a second approver. Kill switch armed.`);
}
function showPositions(){
  const rows = [];
  if(S.btc) rows.push(['BTC','Bitcoin', S.btc.toFixed(5)+' BTC', S.btc*BTC]);
  if(S.usdc) rows.push(['USDC','Base', Math.round(S.usdc).toLocaleString()+' USDC', S.usdc]);
  S.vaults.forEach(v => rows.push([v.name, v.chain+' · '+v.apy+'% APY', fmt(v.bal), v.bal]));
  if(S.vault) rows.push(['VAULT','Base · 7.4% APY', fmt(S.vault), S.vault]);
  const tot = rows.reduce((s,r)=>s+r[3],0);
  agent(`You own:
    <div class="card">
      <div class="khead">YOUR WALLET · ${S.wallet}</div>
      <span class="big">${fmt(tot)}</span>
      ${rows.map(r=>`<div class="row"><span>${r[0]} <span style="color:var(--faint);font-size:11px">· ${r[1]}</span></span><b>${r[2]}</b></div>`).join('')}
    </div>`,
    `You're holding about ${Math.round(tot).toLocaleString()} dollars across ${rows.length} position${rows.length>1?'s':''}.`);
}

/* ---- confirm ---- */
function deny(){
  if(!S.pending){ agent(`No problem — nothing pending.`, `Nothing pending.`); return; }
  S.pending=null; agent(`Cancelled. Nothing moved, and the decision is receipted.`, `Cancelled. Nothing moved.`);
  hints(['Buy some bitcoin']);
}
function affirm(t){
  if(!S.pending){
    if(S.stage==='cold') return wantAsset('buy some bitcoin');
    agent(`Nothing pending — tell me what you'd like to do.`, `Nothing pending yet.`); return;
  }
  const job = S.pending; S.pending = null; vib([15,45,15]);

  if(job.kind==='buy'){
    return execute(
      [{c:'$',n:'YOUR CARD'},{c:'R',n:'RIFT'},{c:job.asset[0],n:job.asset}],
      ['Funding — card authorised','Routing across venues, best fill locked','Settled to your wallet'],
      `Buy ${job.units.toFixed(job.asset==='BTC'?5:4)} ${job.asset} · ${fmt(job.usd)} · best of 6 venues`,
      () => { if(job.asset==='BTC') S.btc += job.units; else S.usdc += job.usd; S.stage='owns'; },
      m => {
        m.querySelector('.bub').insertAdjacentHTML('beforeend',
          `<div class="own"><div class="ob">You own ${job.units.toFixed(job.asset==='BTC'?5:4)} ${job.asset}</div><div class="os">≈ ${fmt(job.usd)} · held in your own wallet</div></div>`);
        hints(['What do I own?','Put my cash to work','Sell $500K of bitcoin']);
      },
      `Done. You own ${job.units.toFixed(5)} bitcoin, held in your own wallet. That took about thirty seconds and you never touched a keyboard.`);
  }
  if(job.kind==='desk'){
    return execute(
      [{c:'B',n:'BTC'},{c:'R',n:'RIFT SPLIT'},{c:'U',n:'USDC · BASE'}],
      ['Second approver notified — risk officer','Approved · splitting across 3 venues','Bridged and settled on Base'],
      `Sell ${fmt(job.amt)} BTC → ${fmt(job.usdc)} USDC · split 55/30/15 · dual-approved`,
      () => { S.usdc += job.usdc; S.btc = Math.max(0, S.btc - job.amt/BTC); S.stage='owns'; },
      m => {
        m.querySelector('.bub').insertAdjacentHTML('beforeend',
          `<div class="own"><div class="ob">${fmt(job.usdc)} USDC on Base</div><div class="os">Dual-approved · 3 venues · one signature</div></div>`);
        hints(['Put my cash to work','What do I own?']);
      },
      `Filled. ${job.usdc >= 1e6 ? Math.round(job.usdc/1e4)/100 + ' million' : Math.round(job.usdc/1e3) + ' thousand'} U S D C settled on Base, split across three venues, dual approved, one signature. Receipt is signed.`);
  }
  if(job.kind==='rebalance'){
    return execute(
      [{c:'V',n:'VAULTS ×'+S.vaults.length},{c:'R',n:'RIFT · CCTP'},{c:'M',n:job.target.name.split(' ')[0].toUpperCase()+' · '+job.target.chain.toUpperCase()}],
      ['Unwinding '+S.vaults.map(v=>v.name).join(' & '),'Routing via CCTP — best of 3 routes','Deposited · receipt tokens in your wallet'],
      `Move ${fmt(job.tot)} → ${job.target.name} · ${job.target.apy}% APY · best route, ${fmt2(job.fee)} fee`,
      () => { S.vaults = [{name:job.target.name, chain:job.target.chain, apy:job.target.apy, bal:job.tot - job.fee}]; },
      m => {
        m.querySelector('.bub').insertAdjacentHTML('beforeend',
          `<div class="own"><div class="ob">${job.blended.toFixed(1)}% → ${job.target.apy}%</div><div class="os">+${fmt(job.gain)}/yr · kept +${fmt(job.keep)} vs next-best route</div></div>`);
        hints(['What do I own?','Sell $500K of bitcoin']);
      },
      `Moved. You went from ${job.blended.toFixed(1)} to ${job.target.apy} percent — about ${Math.round(job.gain/1000)} thousand dollars a year more, and the route itself kept ${job.keep} dollars over the next best. Receipt is signed.`);
  }
  if(job.kind==='vault'){
    return execute(
      [{c:'U',n:'USDC'},{c:'R',n:'RIFT'},{c:'V',n:'VAULT · BASE'}],
      ['Routing deposit cross-chain','Vault position opened','Receipt tokens in your wallet'],
      `Deposit ${fmt(job.amt)} → stable vault · 7.4% APY · unwind anytime`,
      () => { S.usdc = Math.max(0, S.usdc-job.amt); S.vault += job.amt; },
      m => {
        m.querySelector('.bub').insertAdjacentHTML('beforeend',
          `<div class="own"><div class="ob">Earning 7.4%</div><div class="os">+${fmt(job.amt*0.074)}/yr · unwind by voice anytime</div></div>`);
        hints(['What do I own?','What are my limits?']);
      },
      `Deposited. You're earning seven point four percent, about ${Math.round(job.amt*0.074)} dollars a year. Say the word and I'll unwind it anytime.`);
  }
}

function execute(nodes, steps, receiptLine, apply, after, spokenDone){
  const id='e'+Date.now();
  const m = agent(`On it —
    <div class="card">
      <div class="khead">EXECUTING</div>
      <div class="route">
        ${nodes.map((n,i)=>`<div class="rn" id="${id}n${i}"><div class="rc">${n.c}</div><span>${n.n}</span></div>`).join('<div style="flex:1"></div>')}
        <div class="rline"><div class="rfill" id="${id}f"></div></div>
      </div>
      <div class="rstep" id="${id}s">starting…</div>
    </div>`);
  hints([]);
  steps.forEach((st,i)=>{
    setTimeout(()=>{
      $(id+'s').textContent = st;
      $(id+'f').style.width = ((i+1)/steps.length*100)+'%';
      $(id+'n'+i)?.classList.add('on');
      if(i>0) $(id+'n'+(i-1))?.classList.replace('on','done');
      vib(9); scroll();
      if(i===steps.length-1) setTimeout(()=>{
        $(id+'n'+i)?.classList.replace('on','done');
        $(id+'s').textContent='finalized ✓'; $(id+'s').classList.add('done');
        apply();
        m.querySelector('.bub').insertAdjacentHTML('beforeend',
          `<div class="receipt"><span class="g2">✓</span> ${receiptLine}
<span class="g2">✓</span> policy re-checked at execution · receipt <span class="h">${hx()}</span>
<span class="g2">✓</span> tx <span class="h">0x${hx(20)}…</span> · finalized</div>`);
        after && after(m);
        scroll(); speak(spokenDone);
      }, 750);
    }, 900 + i*1450);
  });
}

/* ================= boot ================= */
const DESK = new URLSearchParams(location.search).get('mode') === 'desk' || location.hash === '#desk';
if(DESK){
  // Warm state for desk / OTC audience: wallet live, positions loaded, straight to an order.
  S.wallet = '0x' + hx(4) + '…' + hx(4);
  S.btc = 9.4; S.usdc = 180000; S.stage = 'owns';
  S.vaults = [
    {name:'Aave v3',  chain:'Arbitrum', apy:3.8, bal:400000},
    {name:'Compound', chain:'Ethereum', apy:4.6, bal:250000},
  ];
  $('wpill').textContent = S.wallet; $('wpill').classList.add('show');
  $('hdr').classList.add('show');
  document.querySelector('.zeroq').innerHTML = 'Desk is live.<br>Just talk.';
  document.querySelector('.zerosub').textContent = 'Hands-free — the mic stays open. Positions loaded · limits armed · second approver on call.';
  hints(['Sell $500K of bitcoin','Find me better yield','What do I own?']);
  handsFree = true;
  $('mstat').textContent = 'HANDS-FREE — JUST TALK';
  setTimeout(()=>{ speak(`Desk is live. Positions and limits are loaded — give me an order.`); }, 900);
}else{
  hints(['Buy some bitcoin','I have cash sitting idle']);
  setTimeout(()=>{ speak(`What do you want to own? Just say it — no account, no forms, no keyboard.`); }, 900);
}
if(window.speechSynthesis) speechSynthesis.getVoices();
// Desktop: spacebar toggles the mic — presenter can stay out of frame.
window.addEventListener('keydown', e => {
  if(e.code !== 'Space' || e.repeat) return;
  e.preventDefault();
  document.activeElement && document.activeElement.blur();
  toggleListen();
});
